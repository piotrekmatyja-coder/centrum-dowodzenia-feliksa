<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centrum Dowodzenia Feliksa 🚀</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #273548;
  --bg-border: rgba(255,255,255,0.06);
  --accent: #f59e0b;
  --accent-light: #fbbf24;
  --accent-glow: rgba(245, 158, 11, 0.3);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --sale-zabaw: #8b5cf6;
  --place-zabaw: #22d3ee;
  --muzea: #34d399;
  --teatry: #f472b6;
  --zwierzeta: #a78bfa;
  --inne: #fb923c;
  --kawiarnie: #fbbf24;
  --radius: 16px;
  --radius-sm: 10px;
  --map-tile: dark;
  --header-grad-1: #1e293b;
  --header-grad-2: #0f172a;
  --input-bg: #0f172a;
  --input-border: #334155;
  --scrollbar: #475569;
}

:root.light-theme {
  --bg-dark: #f8fafc;
  --bg-card: #ffffff;
  --bg-card-hover: #f1f5f9;
  --bg-border: rgba(0,0,0,0.08);
  --accent: #d97706;
  --accent-light: #f59e0b;
  --accent-glow: rgba(217, 119, 6, 0.2);
  --text: #1e293b;
  --text-muted: #64748b;
  --map-tile: light;
  --header-grad-1: #fefce8;
  --header-grad-2: #fffbeb;
  --input-bg: #ffffff;
  --input-border: #cbd5e1;
  --scrollbar: #94a3b8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Nunito', 'Inter', sans-serif;
  background: var(--bg-dark);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, var(--header-grad-1) 0%, var(--header-grad-2) 100%);
  border-bottom: 2px solid var(--accent-glow);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1000;
  height: 72px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

.logo-sub {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 600;
}

.logo-emoji {
  font-size: 32px;
  -webkit-text-fill-color: initial;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Search */
.search-box {
  display: flex;
  align-items: center;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 50px;
  padding: 8px 18px;
  gap: 10px;
  min-width: 260px;
  transition: border-color 0.25s;
}

.search-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-box input {
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  outline: none;
  width: 100%;
}

.search-box input::placeholder { color: #64748b; }

.count-badge {
  background: var(--accent);
  color: #1e293b;
  border-radius: 50px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

/* Layout */
.layout {
  display: flex;
  height: calc(100vh - 72px);
}

/* Sidebar */
.sidebar {
  width: 380px;
  min-width: 380px;
  background: var(--bg-card);
  border-right: 1px solid var(--bg-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 18px 20px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.filter-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 10px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.filter-btn {
  padding: 5px 14px;
  border-radius: 50px;
  border: 1.5px solid #334155;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover {
  border-color: var(--accent);
  color: var(--accent-light);
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #1e293b;
  font-weight: 700;
}

/* Places list */
.places-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}

.places-list::-webkit-scrollbar {
  width: 4px;
}
.places-list::-webkit-scrollbar-thumb {
  background: var(--scrollbar);
  border-radius: 10px;
}

.place-item {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  border-left: 3px solid transparent;
  margin-bottom: 4px;
}

.place-item:hover {
  background: var(--bg-card-hover);
}

.place-item.active {
  background: var(--bg-card-hover);
  border-left-color: var(--accent);
}

.place-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.place-item-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
  line-height: 1.3;
}

.place-item-cat {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 8px;
  border-radius: 50px;
  white-space: nowrap;
  flex-shrink: 0;
}

.place-item-desc {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Category badge colors */
.cat-sale_zabaw { background: rgba(139,92,246,0.2); color: #a78bfa; border-left-color: var(--sale-zabaw); }
.cat-place_zabaw { background: rgba(34,211,238,0.15); color: #67e8f9; border-left-color: var(--place-zabaw); }
.cat-muzea { background: rgba(52,211,153,0.15); color: #6ee7b7; border-left-color: var(--muzea); }
.cat-teatry { background: rgba(244,114,182,0.15); color: #f9a8d4; border-left-color: var(--teatry); }
.cat-zwierzeta { background: rgba(167,139,250,0.15); color: #c4b5fd; border-left-color: var(--zwierzeta); }
.cat-inne { background: rgba(251,146,60,0.15); color: #fdba74; border-left-color: var(--inne); }
.cat-kawiarnie { background: rgba(251,191,36,0.15); color: #fcd34d; border-left-color: var(--kawiarnie); }

/* Map */
.map-container {
  flex: 1;
  position: relative;
}

#map {
  width: 100%;
  height: 100%;
}

/* Leaflet overrides */
.leaflet-container {
  background: #0f172a !important;
  font-family: 'Nunito', sans-serif !important;
}

:root.light-theme .leaflet-container {
  background: #e8f4f8 !important;
}

.leaflet-popup-content-wrapper {
  background: #1e293b !important;
  color: var(--text) !important;
  border-radius: 12px !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
}

:root.light-theme .leaflet-popup-content-wrapper {
  background: #ffffff !important;
  border: 1px solid rgba(0,0,0,0.1) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12) !important;
}

:root.light-theme .leaflet-popup-tip {
  background: #ffffff !important;
  border: 1px solid rgba(0,0,0,0.1) !important;
}

.leaflet-popup-tip {
  background: #1e293b !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
}

.leaflet-popup-content {
  margin: 14px 16px !important;
  font-size: 13px !important;
  line-height: 1.5 !important;
  min-width: 220px;
}

.popup-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 4px;
  color: var(--text);
}

.popup-cat {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 2px 10px;
  border-radius: 50px;
  margin-bottom: 8px;
}

.popup-desc {
  color: #cbd5e1;
  margin-bottom: 6px;
  font-size: 13px;
}

.popup-dir-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: #1e293b;
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  border: none;
  cursor: pointer;
  margin-top: 6px;
  transition: all 0.2s;
  text-decoration: none;
}

.popup-dir-btn:hover {
  background: var(--accent-light);
  transform: translateY(-1px);
}

/* Custom marker icons */
.custom-marker {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  border: 3px solid rgba(255,255,255,0.6);
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  transition: transform 0.2s;
}

.custom-marker:hover {
  transform: scale(1.15);
}

/* Legend */
.map-legend {
  position: absolute;
  bottom: 24px;
  right: 16px;
  background: rgba(30,41,59,0.92);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 12px 16px;
  z-index: 1000;
  min-width: 150px;
}

.legend-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text);
  margin-bottom: 3px;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.stat-chip {
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(255,255,255,0.04);
  padding: 3px 10px;
  border-radius: 50px;
  font-weight: 600;
}

.stat-chip strong { color: var(--text); }

/* Responsive */
@media (max-width: 860px) {
  .sidebar {
    width: 100%;
    min-width: auto;
    max-height: 35vh;
    border-right: none;
    border-bottom: 1px solid var(--bg-border);
  }
  .layout {
    flex-direction: column;
  }
  .header {
    flex-wrap: wrap;
    height: auto;
    padding: 6px 10px;
    gap: 4px;
  }
  .header-left {
    gap: 8px;
  }
  .logo {
    font-size: 18px;
  }
  .logo-sub {
    display: none;
  }
  .header-right {
    gap: 6px;
    width: 100%;
  }
  .search-box {
    min-width: 0;
    flex: 1;
    padding: 5px 12px;
  }
  .search-box input {
    font-size: 13px;
  }
  .count-badge {
    font-size: 11px;
    padding: 3px 10px;
  }
  .theme-btn {
    width: 34px;
    height: 34px;
    font-size: 16px;
  }
  .sidebar-header {
    padding: 8px 12px 6px;
  }
  .filter-title {
    font-size: 11px;
    margin-bottom: 6px;
  }
  .filters {
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 4px;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    font-size: 11px;
    padding: 4px 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stats-bar { display: none; }
  .places-list {
    padding: 4px 8px;
  }
  .place-item {
    padding: 8px 10px;
  }
  .place-item-name {
    font-size: 13px;
  }
  .place-item-desc {
    font-size: 11.5px;
    -webkit-line-clamp: 1;
  }
  .place-item-cat {
    font-size: 9px;
    padding: 1px 6px;
  }
  .map-legend { display: none; }
}

@media (max-width: 480px) {
  .header {
    padding: 4px 8px;
  }
  .logo {
    font-size: 15px;
  }
  .logo-emoji {
    font-size: 18px;
  }
  .sidebar {
    max-height: 30vh;
  }
  .search-box {
    padding: 4px 10px;
  }
  .search-box input {
    font-size: 12px;
  }
  .theme-btn {
    width: 30px;
    height: 30px;
    font-size: 14px;
  }
  .count-badge { display: none; }
  .filter-title { display: none; }
  .place-item {
    padding: 6px 8px;
  }
  .place-item-name {
    font-size: 12px;
  }
  .place-item-desc {
    font-size: 11px;
  }
  .place-item-cat {
    font-size: 8px;
    padding: 1px 5px;
  }
}

.leaflet-control-zoom {
  border: none !important;
  box-shadow: 0 2px 12px rgba(0,0,0,0.3) !important;
}

.leaflet-control-zoom a {
  background: #1e293b !important;
  color: var(--text) !important;
  border: 1px solid rgba(255,255,255,0.08) !important;
}

:root.light-theme .leaflet-control-zoom a {
  background: #ffffff !important;
  color: #1e293b !important;
  border: 1px solid rgba(0,0,0,0.12) !important;
}

.leaflet-control-zoom a:hover {
  background: #273548 !important;
}

:root.light-theme .leaflet-control-zoom a:hover {
  background: #f1f5f9 !important;
}

/* Theme toggle button */
.theme-btn {
  background: var(--bg-card);
  border: 1px solid var(--input-border);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  transition: all 0.25s;
  flex-shrink: 0;
}

.theme-btn:hover {
  border-color: var(--accent);
  transform: scale(1.1);
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <span class="logo">
      <span class="logo-emoji">🚀</span> Centrum Dowodzenia Feliksa
    </span>
    <span class="logo-sub">| Miejsca dla dzieci w Warszawie</span>
  </div>
  <div class="header-right">
    <div class="search-box">
      <span style="color:#64748b;">🔍</span>
      <input type="text" id="searchInput" placeholder="Szukaj miejsca..." oninput="filterPlaces()">
    </div>
    <span class="count-badge" id="countBadge">59 miejsc</span>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Przełącz motyw">🌙</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="filter-title">📍 Kategorie</div>
      <div class="filters" id="filters">
        <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">🏁 Wszystkie</button>
        <button class="filter-btn" data-cat="sale_zabaw" onclick="setFilter('sale_zabaw')">🎪 Sale Zabaw</button>
        <button class="filter-btn" data-cat="place_zabaw" onclick="setFilter('place_zabaw')">🛝 Place Zabaw</button>
        <button class="filter-btn" data-cat="muzea" onclick="setFilter('muzea')">🔬 Muzea</button>
        <button class="filter-btn" data-cat="teatry" onclick="setFilter('teatry')">🎭 Teatry</button>
        <button class="filter-btn" data-cat="zwierzeta" onclick="setFilter('zwierzeta')">🐘 Zwierzęta</button>
        <button class="filter-btn" data-cat="kawiarnie" onclick="setFilter('kawiarnie')">☕ Kawiarnie</button>
        <button class="filter-btn" data-cat="inne" onclick="setFilter('inne')">🎡 Inne</button>
      </div>
      <div class="stats-bar" id="statsBar" style="margin-top:8px;"></div>
    </div>
    <div class="places-list" id="placesList"></div>
  </div>

  <!-- MAP -->
  <div class="map-container">
    <div id="map"></div>
    <div class="map-legend">
      <div class="legend-title">Legenda</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--sale-zabaw)"></span> Sale Zabaw</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--place-zabaw)"></span> Place Zabaw</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--muzea)"></span> Muzea</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--teatry)"></span> Teatry</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--zwierzeta)"></span> Zwierzęta</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--inne)"></span> Inne</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--kawiarnie)"></span> Kawiarnie</div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

088079, "address": "Fundacja Sto Pociech, 20/24a, Freta, Staromiejskie, Nowe Miasto, Śródmieście, Warszawa, województwo mazowieckie, 00-227,", "desc": "Kawa, plac zabaw, warsztaty i konsultacje pedagogiczne w jednym. Społeczność rodziców! ☕"}, {"name": "Zizi Cafe", "cat": "kawiarnie", "cat_label": "Kawiarnie i Relaks", "lat": 52.2924279, "lon": 20.9401301, "address": "Zizi Cafe, Przy Agorze, Wrzeciono, Bielany, Warszawa, województwo mazowieckie, 01-960, Polska", "desc": "Kawiarnia przyjazna rodzinom — kącik zabaw, zdrowe jedzenie, pyszna kawa dla rodziców. 🧁"}];

// ===== CATEGORY CONFIG =====
const CAT_COLORS = {
  sale_zabaw: '#8b5cf6',
  place_zabaw: '#22d3ee',
  muzea: '#34d399',
  teatry: '#f472b6',
  zwierzeta: '#a78bfa',
  inne: '#fb923c',
  kawiarnie: '#fbbf24'
};

const CAT_EMOJIS = {
  sale_zabaw: '🎪',
  place_zabaw: '🛝',
  muzea: '🔬',
  teatry: '🎭',
  zwierzeta: '🐘',
  inne: '🎡',
  kawiarnie: '☕'
};

const CAT_LABELS = {
  sale_zabaw: 'Sale Zabaw',
  place_zabaw: 'Place Zabaw',
  muzea: 'Muzea i Edukacja',
  teatry: 'Teatry i Kultura',
  zwierzeta: 'Zwierzęta i Przyroda',
  inne: 'Inne Atrakcje',
  kawiarnie: 'Kawiarnie i Relaks'
};

// ===== STATE =====
let currentFilter = 'all';
let currentSearch = '';
let activeMarker = null;
let map, markersLayer, markers = [], tileLayer;

// ===== MAP INIT =====
function initMap() {
  map = L.map('map', {
    center: [52.22, 21.02],
    zoom: 12,
    zoomControl: true,
    attributionControl: false,
    fadeAnimation: true,
    zoomAnimation: true
  });

  tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    noWrap: true
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  renderMarkers(PLACES);
  fitMap(PLACES);
  renderList(PLACES);
}

// ===== MARKER FACTORY =====
function createMarkerIcon(cat) {
  const color = CAT_COLORS[cat] || '#94a3b8';
  const emoji = CAT_EMOJIS[cat] || '📍';
  return L.divIcon({
    className: '',
    html: `<div class="custom-marker" style="background:${color};border-color:rgba(255,255,255,0.7);box-shadow:0 2px 12px ${color}55;">${emoji}</div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 18],
    popupAnchor: [0, -22]
  });
}

// ===== MARKERS RENDER =====
function renderMarkers(places) {
  markersLayer.clearLayers();
  markers = [];

  const filtered = filterData(places);

  filtered.forEach((p, i) => {
    const marker = L.marker([p.lat, p.lon], {
      icon: createMarkerIcon(p.cat),
      riseOnHover: true
    });

    const catLabel = CAT_LABELS[p.cat] || p.cat_label;
    const catBadge = `<span class="popup-cat" style="background:${CAT_COLORS[p.cat]}22;color:${CAT_COLORS[p.cat]}">${CAT_EMOJIS[p.cat]} ${catLabel}</span>`;

    const dirUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;

    marker.bindPopup(`
      <div>
        <div class="popup-title">${p.name}</div>
        ${catBadge}
        <div class="popup-desc">${p.desc}</div>
        <a href="${dirUrl}" target="_blank" class="popup-dir-btn">🗺️ Nawiguj</a>
      </div>
    `);

    marker.on('click', () => {
      activeMarker = marker;
      highlightListItem(p.name);
    });

    markers.push({ marker, place: p });
    markersLayer.addLayer(marker);
  });
}

// ===== FIT MAP =====
function fitMap(places) {
  const filtered = filterData(places);
  if (filtered.length === 0) return;
  const bounds = L.latLngBounds(filtered.map(p => [p.lat, p.lon]));
  if (filtered.length === 1) {
    map.setView([filtered[0].lat, filtered[0].lon], 14);
  } else {
    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
  }
}

// ===== FILTER =====
function filterData(places) {
  return places.filter(p => {
    if (currentFilter !== 'all' && p.cat !== currentFilter) return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      const inName = p.name.toLowerCase().includes(q);
      const inDesc = (p.desc || '').toLowerCase().includes(q);
      const inCat = CAT_LABELS[p.cat].toLowerCase().includes(q);
      if (!inName && !inDesc && !inCat) return false;
    }
    return true;
  });
}

// ===== SIDEBAR LIST =====
function renderList(places) {
  const container = document.getElementById('placesList');
  const filtered = filterData(places);

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;">😕 Brak miejsc spełniających kryteria</div>';
    document.getElementById('countBadge').textContent = '0 miejsc';
    document.getElementById('statsBar').innerHTML = '';
    return;
  }

  // Stats
  const counts = {};
  filtered.forEach(p => { counts[p.cat] = (counts[p.cat] || 0) + 1; });
  const statsHtml = Object.entries(counts).map(([cat, n]) =>
    `<span class="stat-chip"><span style="color:${CAT_COLORS[cat]}">${CAT_EMOJIS[cat]}</span> <strong>${n}</strong> ${CAT_LABELS[cat]}</span>`
  ).join('');
  document.getElementById('statsBar').innerHTML = statsHtml;

  document.getElementById('countBadge').textContent = `${filtered.length} miejsc`;

  // List items
  const html = filtered.map(p => {
    const catColor = CAT_COLORS[p.cat];
    return `<div class="place-item cat-${p.cat}" data-name="${p.name}" onclick="focusPlace('${p.name}')">
      <div class="place-item-header">
        <span class="place-item-name">${p.name}</span>
        <span class="place-item-cat" style="background:${catColor}18;color:${catColor}">${CAT_EMOJIS[p.cat]} ${CAT_LABELS[p.cat]}</span>
      </div>
      <div class="place-item-desc">${p.desc}</div>
    </div>`;
  }).join('');
  container.innerHTML = html;
}

// ===== FOCUS PLACE =====
function focusPlace(name) {
  const entry = markers.find(m => m.place.name === name);
  if (!entry) return;

  map.setView([entry.place.lat, entry.place.lon], 15, { animate: true });
  entry.marker.openPopup();

  if (activeMarker) {
    activeMarker.closePopup();
  }
  activeMarker = entry.marker;
  highlightListItem(name);
}

function highlightListItem(name) {
  document.querySelectorAll('.place-item').forEach(el => {
    el.classList.toggle('active', el.dataset.name === name);
  });
  // Scroll into view
  const el = document.querySelector(`.place-item[data-name="${name}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ===== FILTER / SEARCH =====
function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.cat === cat);
  });
  applyFilters();
}

function filterPlaces() {
  currentSearch = document.getElementById('searchInput').value;
  applyFilters();
}

function applyFilters() {
  const filtered = filterData(PLACES);
  markersLayer.clearLayers();
  renderMarkers(PLACES);
  renderList(PLACES);
  fitMap(PLACES);
}

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    document.getElementById('searchInput').focus();
    e.preventDefault();
  }
});

// ===== THEME TOGGLE =====
const DARK_TILES = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
const LIGHT_TILES = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

function toggleTheme() {
  const html = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const isLight = html.classList.toggle('light-theme');
  const theme = isLight ? 'light' : 'dark';

  // Update button icon
  btn.textContent = isLight ? '☀️' : '🌙';

  // Switch map tiles
  const newUrl = isLight ? LIGHT_TILES : DARK_TILES;
  tileLayer.setUrl(newUrl);

  // Save preference
  localStorage.setItem('feliks-theme', theme);
}

// Load saved theme on boot
function loadTheme() {
  const saved = localStorage.getItem('feliks-theme');
  if (saved === 'light') {
    document.documentElement.classList.add('light-theme');
    document.getElementById('themeToggle').textContent = '☀️';
  }
}

// ===== BOOT =====
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadTheme();
});
</script>
</body>
</html>
